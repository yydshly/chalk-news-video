<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Theme Sample: research_desk_v2</title>
<style>
  html, body { margin: 0; padding: 0; background: #0a0a14; overflow: hidden; }
  .sample-label {
    position: fixed; top: 12px; left: 12px; z-index: 100;
    background: rgba(20,20,40,0.9); color: #86efac; font-size: 12px;
    padding: 4px 10px; border-radius: 4px; font-family: sans-serif;
  }
  svg.board { display: block; background: #0a0a14; }
</style>
</head>
<body>
<div class="sample-label">🔬 主题样例 · AI 研究室风</div>
<svg class="board" viewBox="0 0 1280 720" width="1280" height="720" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="deskGrid" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <rect width="40" height="40" fill="#0a0a14"/>
      <line x1="0" y1="0" x2="40" y2="0" stroke="#1a1a2e" stroke-width="0.5"/>
      <line x1="0" y1="0" x2="0" y2="40" stroke="#1a1a2e" stroke-width="0.5"/>
    </pattern>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="researchBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f1a2a"/>
      <stop offset="100%" stop-color="#0a0a14"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="720" fill="url(#deskGrid)"/>
  <!-- Ambient glow top -->
  <ellipse cx="640" cy="0" rx="600" ry="200" fill="#0f2040" opacity="0.3"/>
  <!-- Title with research style -->
  <text x="640" y="55" text-anchor="middle" fill="#7dd3fc" font-size="28" font-weight="bold" font-family="monospace">RESEARCH DESK v2</text>
  <text x="640" y="80" text-anchor="middle" fill="#38bdf8" font-size="13" font-family="monospace">TECHNICAL ANALYSIS REPORT</text>
  <line x1="200" y1="95" x2="1080" y2="95" stroke="#1e3a5f" stroke-width="1"/>
  <!-- Research node 1 -->
  <rect x="80" y="130" width="360" height="180" rx="4" ry="4" fill="#0f1a2a" stroke="#1e3a5f" stroke-width="1"/>
  <rect x="80" y="130" width="360" height="4" rx="2" ry="2" fill="#38bdf8" opacity="0.6"/>
  <text x="100" y="160" fill="#7dd3fc" font-size="14" font-family="monospace">MODEL: GPT-5</text>
  <text x="100" y="185" fill="#94a3b8" font-size="12" font-family="monospace">Parameters: ~1.8T</text>
  <text x="100" y="205" fill="#94a3b8" font-size="12" font-family="monospace">Context: 256K tokens</text>
  <text x="100" y="225" fill="#94a3b8" font-size="12" font-family="monospace">Multimodal: ✓ Yes</text>
  <text x="100" y="245" fill="#94a3b8" font-size="12" font-family="monospace">Benchmarks: SOTA</text>
  <text x="100" y="275" fill="#38bdf8" font-size="11" font-family="monospace">Source: OpenAI Official</text>
  <!-- Research node 2 -->
  <rect x="460" y="130" width="360" height="180" rx="4" ry="4" fill="#0f1a2a" stroke="#1e3a5f" stroke-width="1"/>
  <rect x="460" y="130" width="360" height="4" rx="2" ry="2" fill="#f87171" opacity="0.6"/>
  <text x="480" y="160" fill="#7dd3fc" font-size="14" font-family="monospace">MODEL: Claude 4</text>
  <text x="480" y="185" fill="#94a3b8" font-size="12" font-family="monospace">Parameters: ~1.5T</text>
  <text x="480" y="205" fill="#94a3b8" font-size="12" font-family="monospace">Context: 200K tokens</text>
  <text x="480" y="225" fill="#94a3b8" font-size="12" font-family="monospace">Multimodal: ✓ Yes</text>
  <text x="480" y="245" fill="#94a3b8" font-size="12" font-family="monospace">Benchmarks: SOTA</text>
  <text x="480" y="275" fill="#38bdf8" font-size="11" font-family="monospace">Source: Anthropic Official</text>
  <!-- Research node 3 -->
  <rect x="840" y="130" width="360" height="180" rx="4" ry="4" fill="#0f1a2a" stroke="#1e3a5f" stroke-width="1"/>
  <rect x="840" y="130" width="360" height="4" rx="2" ry="2" fill="#fbbf24" opacity="0.6"/>
  <text x="860" y="160" fill="#7dd3fc" font-size="14" font-family="monospace">MODEL: Gemini 2.0</text>
  <text x="860" y="185" fill="#94a3b8" font-size="12" font-family="monospace">Parameters: ~1.2T</text>
  <text x="860" y="205" fill="#94a3b8" font-size="12" font-family="monospace">Context: 512K tokens</text>
  <text x="860" y="225" fill="#94a3b8" font-size="12" font-family="monospace">Multimodal: ✓ Yes</text>
  <text x="860" y="245" fill="#94a3b8" font-size="12" font-family="monospace">Benchmarks: SOTA</text>
  <text x="860" y="275" fill="#38bdf8" font-size="11" font-family="monospace">Source: Google DeepMind</text>
  <!-- Comparison table -->
  <rect x="80" y="340" width="1120" height="120" rx="4" ry="4" fill="#0a1020" stroke="#1e3a5f" stroke-width="1"/>
  <text x="100" y="365" fill="#7dd3fc" font-size="13" font-family="monospace">COMPARISON MATRIX</text>
  <line x1="80" y1="375" x2="1200" y2="375" stroke="#1e3a5f" stroke-width="0.5"/>
  <text x="100" y="395" fill="#94a3b8" font-size="11" font-family="monospace">Capability      </text>
  <text x="340" y="395" fill="#7dd3fc" font-size="11" font-family="monospace">GPT-5   </text>
  <text x="540" y="395" fill="#f87171" font-size="11" font-family="monospace">Claude4 </text>
  <text x="740" y="395" fill="#fbbf24" font-size="11" font-family="monospace">Gemini2 </text>
  <text x="100" y="418" fill="#64748b" font-size="11" font-family="monospace">Reasoning        </text>
  <text x="340" y="418" fill="#4ade80" font-size="11" font-family="monospace">●●●●●  </text>
  <text x="540" y="418" fill="#4ade80" font-size="11" font-family="monospace">●●●●●  </text>
  <text x="740" y="418" fill="#4ade80" font-size="11" font-family="monospace">●●●●○  </text>
  <text x="100" y="440" fill="#64748b" font-size="11" font-family="monospace">Code Generation   </text>
  <text x="340" y="440" fill="#4ade80" font-size="11" font-family="monospace">●●●●●  </text>
  <text x="540" y="440" fill="#94a3b8" font-size="11" font-family="monospace">●●●○○  </text>
  <text x="740" y="440" fill="#4ade80" font-size="11" font-family="monospace">●●●●○  </text>
  <!-- Insight box -->
  <rect x="80" y="480" width="1120" height="80" rx="4" ry="4" fill="#0f2040" stroke="#38bdf8" stroke-width="1" opacity="0.5"/>
  <text x="100" y="505" fill="#38bdf8" font-size="12" font-family="monospace">💡 KEY INSIGHT</text>
  <text x="100" y="528" fill="#e2e8f0" font-size="12" font-family="monospace">All three models have reached SOTA on most benchmarks. The differentiation now lies in</text>
  <text x="100" y="548" fill="#e2e8f0" font-size="12" font-family="monospace">deployment efficiency, pricing, and specialized domain performance.</text>
  <!-- Speaker cards -->
  <rect x="200" y="590" width="360" height="90" rx="6" ry="6" fill="#0a1020" stroke="#1e3a5f" stroke-width="1" opacity="0.8"/>
  <text x="220" y="615" fill="#38bdf8" font-size="12" font-family="monospace">RESEARCHER A</text>
  <text x="220" y="638" fill="#64748b" font-size="11" font-family="monospace">从技术指标来看...</text>
  <rect x="720" y="590" width="360" height="90" rx="6" ry="6" fill="#0a1020" stroke="#1e3a5f" stroke-width="1" opacity="0.8"/>
  <text x="740" y="615" fill="#f87171" font-size="12" font-family="monospace">RESEARCHER B</text>
  <text x="740" y="638" fill="#64748b" font-size="11" font-family="monospace">但实际部署成本...</text>
</svg>
</body>
</html>
