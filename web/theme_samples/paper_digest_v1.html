<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Theme Sample: paper_digest_v1</title>
<style>
  html, body { margin: 0; padding: 0; background: #fafafa; overflow: hidden; }
  .sample-label {
    position: fixed; top: 12px; left: 12px; z-index: 100;
    background: rgba(250,250,250,0.95); color: #374151; font-size: 12px;
    padding: 4px 10px; border-radius: 4px; font-family: sans-serif; border: 1px solid #e5e7eb;
  }
</style>
</head>
<body>
<div class="sample-label">📄 主题样例 · 论文速读</div>
<svg viewBox="0 0 1280 720" width="1280" height="720" xmlns="http://www.w3.org/2000/svg">
  <rect width="1280" height="720" fill="#fafafa"/>
  <!-- Header -->
  <text x="640" y="55" text-anchor="middle" fill="#111827" font-size="26" font-weight="bold" font-family="sans-serif">arXiv 论文速读</text>
  <text x="640" y="82" text-anchor="middle" fill="#6b7280" font-size="13" font-family="sans-serif">cs.AI · 2026-06-24</text>
  <!-- Paper card -->
  <rect x="80" y="110" width="1120" height="380" rx="8" fill="white" stroke="#e5e7eb" stroke-width="1"/>
  <!-- Title -->
  <rect x="80" y="110" width="1120" height="60" rx="8" fill="#1e3a8a"/>
  <text x="640" y="148" text-anchor="middle" fill="white" font-size="18" font-weight="bold" font-family="sans-serif">Scaling Laws for Sparse Mixture-of-Experts Language Models</text>
  <!-- Meta row -->
  <rect x="80" y="170" width="1120" height="40" fill="#eff6ff"/>
  <text x="120" y="196" fill="#1e3a8a" font-size="12" font-family="sans-serif">📄 arXiv:2606.12345</text>
  <text x="400" y="196" fill="#374151" font-size="12" font-family="sans-serif">👥 Authors: 5 位</text>
  <text x="640" y="196" fill="#374151" font-size="12" font-family="sans-serif">📅 2026-06-20</text>
  <text x="900" y="196" fill="#374151" font-size="12" font-family="sans-serif">⭐ 482 citations</text>
  <!-- Sections -->
  <text x="110" y="245" fill="#111827" font-size="13" font-weight="bold" font-family="sans-serif">📌 核心贡献</text>
  <text x="110" y="270" fill="#374151" font-size="12" font-family="sans-serif">• 提出稀疏 MoE 模型的可扩展性定律</text>
  <text x="110" y="295" fill="#374151" font-size="12" font-family="sans-serif">• 首次系统研究 experts 数量与模型性能关系</text>
  <text x="110" y="320" fill="#374151" font-size="12" font-family="sans-serif">• 发现 8-16 个 experts 为最优区间</text>

  <text x="110" y="360" fill="#111827" font-size="13" font-weight="bold" font-family="sans-serif">🔬 方法</text>
  <text x="110" y="385" fill="#374151" font-size="12" font-family="sans-serif">基于 125M–175B 参数规模的系统实验，</text>
  <text x="110" y="405" fill="#374151" font-size="12" font-family="sans-serif">使用 1T token 训练数据得出缩放定律。</text>

  <text x="110" y="440" fill="#111827" font-size="13" font-weight="bold" font-family="sans-serif">💡 关键发现</text>
  <text x="110" y="465" fill="#374151" font-size="12" font-family="sans-serif">稀疏激活 MoE 在相同计算量下，</text>
  <text x="110" y="485" fill="#374151" font-size="12" font-family="sans-serif">相比密集模型可获得 2.3 倍的效率提升。</text>
  <!-- Takeaway -->
  <rect x="80" y="510" width="1120" height="60" rx="6" fill="#f0fdf4" stroke="#86efac" stroke-width="1"/>
  <text x="640" y="542" text-anchor="middle" fill="#166534" font-size="13" font-family="sans-serif">💡  takeaway：对未来大模型架构选择有重要参考价值，推荐阅读</text>

  <!-- Speaker cards -->
  <rect x="200" y="600" width="360" height="60" rx="8" fill="white" stroke="#e5e7eb"/>
  <text x="220" y="628" fill="#1e3a8a" font-size="12" font-family="sans-serif">主播 A：这是本周最有价值的论文...</text>
  <rect x="720" y="600" width="360" height="60" rx="8" fill="white" stroke="#e5e7eb"/>
  <text x="740" y="628" fill="#dc2626" font-size="12" font-family="sans-serif">主播 B：MoE 的 scaling laws 很关键...</text>
</svg>
</body>
</html>
