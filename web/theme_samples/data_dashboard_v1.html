<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Theme Sample: data_dashboard_v1</title>
<style>
  html, body { margin: 0; padding: 0; background: #0f172a; overflow: hidden; }
  .sample-label {
    position: fixed; top: 12px; left: 12px; z-index: 100;
    background: rgba(15,23,42,0.9); color: #4ade80; font-size: 12px;
    padding: 4px 10px; border-radius: 4px; font-family: sans-serif;
  }
</style>
</head>
<body>
<div class="sample-label">📊 主题样例 · 数据仪表盘</div>
<svg viewBox="0 0 1280 720" width="1280" height="720" xmlns="http://www.w3.org/2000/svg">
  <rect width="1280" height="720" fill="#0f172a"/>
  <text x="640" y="50" text-anchor="middle" fill="#f8fafc" font-size="26" font-weight="bold" font-family="sans-serif">AI 行业数据仪表盘</text>
  <text x="640" y="80" text-anchor="middle" fill="#64748b" font-size="13" font-family="sans-serif">2026-06-24 · 最新数据</text>
  <!-- KPI cards row -->
  <rect x="60" y="110" width="260" height="120" rx="8" fill="#1e293b" stroke="#2d3748" stroke-width="1"/>
  <text x="190" y="145" text-anchor="middle" fill="#64748b" font-size="12" font-family="sans-serif">模型评分</text>
  <text x="190" y="185" text-anchor="middle" fill="#4ade80" font-size="36" font-weight="bold" font-family="sans-serif">9.5</text>
  <text x="190" y="215" text-anchor="middle" fill="#64748b" font-size="11" font-family="sans-serif">GPT-5 · +0.8</text>

  <rect x="340" y="110" width="260" height="120" rx="8" fill="#1e293b" stroke="#2d3748" stroke-width="1"/>
  <text x="470" y="145" text-anchor="middle" fill="#64748b" font-size="12" font-family="sans-serif">融资额</text>
  <text x="470" y="185" text-anchor="middle" fill="#38bdf8" font-size="36" font-weight="bold" font-family="sans-serif">$12B</text>
  <text x="470" y="215" text-anchor="middle" fill="#64748b" font-size="11" font-family="sans-serif">本月全球 AI 领域</text>

  <rect x="620" y="110" width="260" height="120" rx="8" fill="#1e293b" stroke="#2d3748" stroke-width="1"/>
  <text x="750" y="145" text-anchor="middle" fill="#64748b" font-size="12" font-family="sans-serif">活跃模型</text>
  <text x="750" y="185" text-anchor="middle" fill="#f59e0b" font-size="36" font-weight="bold" font-family="sans-serif">2,847</text>
  <text x="750" y="215" text-anchor="middle" fill="#64748b" font-size="11" font-family="sans-serif">较上月 +312</text>

  <rect x="900" y="110" width="260" height="120" rx="8" fill="#1e293b" stroke="#2d3748" stroke-width="1"/>
  <text x="1030" y="145" text-anchor="middle" fill="#64748b" font-size="12" font-family="sans-serif">开源项目</text>
  <text x="1030" y="185" text-anchor="middle" fill="#a78bfa" font-size="36" font-weight="bold" font-family="sans-serif">48.3K</text>
  <text x="1030" y="215" text-anchor="middle" fill="#64748b" font-size="11" font-family="sans-serif">GitHub 新增</text>

  <!-- Bar chart -->
  <text x="100" y="270" fill="#94a3b8" font-size="13" font-weight="bold" font-family="sans-serif">各模型市场份额</text>
  <rect x="100" y="290" width="540" height="30" rx="4" fill="#1e293b"/>
  <rect x="100" y="290" width="270" height="30" rx="4" fill="#38bdf8"/>
  <text x="235" y="310" fill="#0f172a" font-size="11" font-weight="bold" font-family="sans-serif">GPT-5 50%</text>

  <rect x="100" y="325" width="540" height="30" rx="4" fill="#1e293b"/>
  <rect x="100" y="325" width="162" height="30" rx="4" fill="#f59e0b"/>
  <text x="180" y="345" fill="#0f172a" font-size="11" font-weight="bold" font-family="sans-serif">Claude 4 30%</text>

  <rect x="100" y="360" width="540" height="30" rx="4" fill="#1e293b"/>
  <rect x="100" y="360" width="108" height="30" rx="4" fill="#4ade80"/>
  <text x="150" y="380" fill="#0f172a" font-size="11" font-weight="bold" font-family="sans-serif">Gemini 20%</text>

  <!-- Line chart -->
  <text x="700" y="270" fill="#94a3b8" font-size="13" font-weight="bold" font-family="sans-serif">用户量趋势（万）</text>
  <polyline points="700,400 780,380 860,350 940,310 1020,270 1100,240" stroke="#4ade80" stroke-width="3" fill="none"/>
  <circle cx="700" cy="400" r="6" fill="#4ade80"/>
  <circle cx="780" cy="380" r="6" fill="#4ade80"/>
  <circle cx="860" cy="350" r="6" fill="#4ade80"/>
  <circle cx="940" cy="310" r="6" fill="#4ade80"/>
  <circle cx="1020" cy="270" r="6" fill="#4ade80"/>
  <circle cx="1100" cy="240" r="6" fill="#4ade80"/>
  <text x="1100" y="220" fill="#4ade80" font-size="11" font-family="sans-serif">+127%</text>

  <!-- Summary row -->
  <rect x="60" y="450" width="1080" height="100" rx="8" fill="#1e293b"/>
  <text x="640" y="485" text-anchor="middle" fill="#f8fafc" font-size="15" font-weight="bold" font-family="sans-serif">今日数据小结：模型能力竞争加剧，开源生态持续扩张</text>
  <text x="640" y="515" text-anchor="middle" fill="#64748b" font-size="12" font-family="sans-serif">展示：数据仪表盘 · data_dashboard_v1</text>

  <!-- Speaker cards -->
  <rect x="200" y="590" width="360" height="70" rx="8" fill="#1e293b" stroke="#2d3748" opacity="0.8"/>
  <text x="220" y="618" fill="#38bdf8" font-size="12" font-family="sans-serif">主播 A：来看数据解读...</text>
  <rect x="720" y="590" width="360" height="70" rx="8" fill="#1e293b" stroke="#2d3748" opacity="0.8"/>
  <text x="740" y="618" fill="#f87171" font-size="12" font-family="sans-serif">主播 B：开源增速最亮眼...</text>
</svg>
</body>
</html>
