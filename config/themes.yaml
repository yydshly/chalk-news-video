# Theme System V1 (CP10) + Theme Layout System V1 (CP11)
# Each theme defines the visual tokens and layout tokens for the renderer.
# Themes only affect visual expression, not business contracts.

default_theme: chalkboard

themes:
  chalkboard:
    name: "绿色黑板"
    background:
      type: grid
      color: "#143b2e"
      grid_color: "#1f523e"
    text:
      title: "#f8f8f2"
      body: "#d8e6d4"
      subtitle: "#ffffff"
    node:
      fill: "#fff8dc"
      stroke: "#f0d77b"
      text: "#1d1d1d"
      badge_fill: "#143b2e"
      badge_text: "#f8f8f2"
    edge:
      stroke: "#f8f8f2"
      label: "#f8f8f2"
    callout:
      info_fill: "#ffe066"
      info_stroke: "#b58900"
      info_text: "#5d4037"
      alert_fill: "#ff8a65"
      alert_stroke: "#bf360c"
      alert_text: "#ffffff"
      positive_fill: "#a5d6a7"
      positive_stroke: "#2e7d32"
      positive_text: "#1b5e20"
    dialogue:
      host_accent: "#4db6ac"
      expert_accent: "#f0d77b"
      host_indicator: "#4db6ac"
      expert_indicator: "#f0d77b"
      panel_fill: "rgba(20,59,46,0.85)"
      panel_stroke: "#4db6ac"
      subtitle_fill: "rgba(0,0,0,0.75)"
    layout:
      variant: chalkboard_v1
      canvas:
        safe_margin: 48
      title:
        y: 70
        font_size: 36
      nodes:
        style: chalk_card
        radius: 10
        shadow: true
        stroke_width: 3
      dialogue:
        panel_position: side
        panel_y: 160
        panel_w: 180
        panel_h: 90
        subtitle_h: 64
        subtitle_font_size: 22

