      info_stroke: "#0284c7"
      info_text: "#f8fafc"
      alert_fill: "#fb923c"
      alert_stroke: "#ea580c"
      alert_text: "#f8fafc"
      positive_fill: "#22c55e"
      positive_stroke: "#16a34a"
      positive_text: "#f8fafc"
    dialogue:
      host_accent: "#38bdf8"
      expert_accent: "#facc15"
      host_indicator: "#38bdf8"
      expert_indicator: "#facc15"
      panel_fill: "rgba(15,23,42,0.92)"
