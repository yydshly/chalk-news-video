<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>chalk-news-video animation</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #000;
    overflow: hidden;
  }
  svg.board {
    display: block;
    background: #143b2e;
  }

  /* CP9: Dialogue speaker cards */
  .speaker-card {
    opacity: 0.55;
    transition: opacity 0.3s ease;
  }
  .speaker-card.active {
    opacity: 1;
  }
  .speaker-card-label {
    font-family: Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif;
    font-size: 14px;
    fill: #f8f8f2;
  }
  .speaker-card-name {
    font-family: Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif;
    font-size: 18px;
    font-weight: bold;
    fill: #ffffff;
  }
  .active-pulse {
    animation: pulse 1.2s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }

  /* CP11: Node style variants */
  /* chalk_card: default chalkboard feel */
  .node-card { rx: 10; ry: 10; }
  /* modern_panel: sleeker, less rounded */
  .node-modern { rx: 8; ry: 8; }
  /* research_card: tighter corners */
  .node-research { rx: 6; ry: 6; }
  /* paper_note: soft, paper-like */
  .node-paper { rx: 12; ry: 12; }
  /* news_main_card: news card style */
  .node-news-main { rx: 12; ry: 12; }

  /* CP16: Enhanced node animations */
  @keyframes cardEnter {
    0% { opacity: 0; transform: scale(0.85) translateY(15px); }
    60% { opacity: 1; transform: scale(1.02) translateY(-2px); }
    100% { opacity: 1; transform: scale(1) translateY(0); }
  }
  @keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }
  @keyframes slideInLeft {
    0% { opacity: 0; transform: translateX(-30px); }
    100% { opacity: 1; transform: translateX(0); }
  }
  @keyframes slideInRight {
    0% { opacity: 0; transform: translateX(30px); }
    100% { opacity: 1; transform: translateX(0); }
  }
  .node-enter {
    animation: cardEnter 0.5s ease-out forwards;
  }
  .title-enter {
    animation: fadeIn 0.6s ease-out forwards;
  }

  /* CP17: News card specific animations */
  @keyframes slideUp {
    0% { opacity: 0; transform: translateY(20px); }
    100% { opacity: 1; transform: translateY(0); }
  }
  @keyframes keyCardEnter {
    0% { opacity: 0; transform: translateY(12px) scale(0.95); }
    100% { opacity: 1; transform: translateY(0) scale(1); }
  }
  @keyframes progressFill {
    from { width: 0%; }
  }
  .news-header-enter {
    animation: fadeIn 0.4s ease-out forwards;
  }
  .main-card-enter {
    animation: slideUp 0.5s ease-out forwards;
  }
  .key-card-enter {
    animation: keyCardEnter 0.4s ease-out forwards;
  }
</style>
</head>
<body>
<svg id="board" class="board" xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 {{ render_ir.canvas.width }} {{ render_ir.canvas.height }}"
     width="{{ render_ir.canvas.width }}" height="{{ render_ir.canvas.height }}">

  <defs>
    <pattern id="boardGrid" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <rect width="40" height="40" fill="#143b2e"/>
      <line x1="0" y1="0" x2="40" y2="0" stroke="#1f523e" stroke-width="1"/>
      <line x1="0" y1="0" x2="0" y2="40" stroke="#1f523e" stroke-width="1"/>
    </pattern>

    <filter id="chalkRough" x="-2%" y="-2%" width="104%" height="104%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" result="t"/>
      <feDisplacementMap in="SourceGraphic" in2="t" scale="0.8"/>
    </filter>

    <marker id="arrowhead" markerWidth="12" markerHeight="12"
            refX="10" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L0,8 L10,4 z" fill="#f8f8f2"/>
    </marker>

    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect id="board-bg" width="{{ render_ir.canvas.width }}" height="{{ render_ir.canvas.height }}"
        fill="url(#boardGrid)"/>

  <!-- Title group: fades in once on the first beat that reveals 'title', then stays -->
  <!-- CP16: Title uses tspan lines for proper wrapping -->
  <g id="title-group" opacity="0">
    <text id="title-text" x="{{ render_ir.title.x }}" y="{{ render_ir.title.y }}"
          text-anchor="middle" fill="#f8f8f2"
          font-family="'PingFang SC', 'Microsoft YaHei', 'SimHei', sans-serif"
          font-size="32" font-weight="bold"
          filter="url(#chalkRough)">
      <tspan id="title-line-0" x="{{ render_ir.title.x }}"></tspan>
      <tspan id="title-line-1" x="{{ render_ir.title.x }}" dy="1.2em"></tspan>
      <tspan id="title-line-2" x="{{ render_ir.title.x }}" dy="1.2em"></tspan>
    </text>
    <text id="summary-text" x="{{ render_ir.summary.x }}" y="{{ render_ir.summary.y }}"
          text-anchor="middle" fill="#d8e6d4"
          font-family="'PingFang SC', 'Microsoft YaHei', sans-serif"
          font-size="18">
      <tspan id="summary-line-0" x="{{ render_ir.summary.x }}"></tspan>
      <tspan id="summary-line-1" x="{{ render_ir.summary.x }}" dy="1.3em"></tspan>
    </text>
  </g>

  <g id="edges-group"></g>
  <g id="nodes-group"></g>
  <g id="callouts-group"></g>

  <!-- CP17: News card specific elements (only rendered for news_card_v1) -->
  <g id="news-card-header" opacity="0">
    <!-- Breaking news badge -->
    <rect id="breaking-badge" x="36" y="12" width="60" height="24" rx="4" ry="4" fill="#ff3535"/>
    <text id="breaking-text" x="66" y="29" text-anchor="middle" fill="#ffffff"
          font-family="'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="bold">NEWS</text>
    <!-- Source info -->
    <text id="source-text" x="1244" y="29" text-anchor="end" fill="#9090a0"
          font-family="'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13"></text>
  </g>

  <!-- CP17: Main event card (what happened) -->
  <g id="main-event-card" opacity="0">
    <rect id="main-card-bg" x="60" y="130" width="1160" height="130" rx="12" ry="12"
          fill="#1e1e38" stroke="#ff6b35" stroke-width="2" filter="url(#cardShadow)"/>
    <text id="main-card-label" x="80" y="155" fill="#ff6b35"
          font-family="'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="bold">发生了什么</text>
    <text id="main-card-title" x="80" y="180" fill="#ffffff"
          font-family="'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="18"></text>
    <text id="main-card-desc" x="80" y="205" fill="#b0b0c0"
          font-family="'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14"></text>
  </g>

  <!-- CP17: Key point cards (3 cards) -->
  <g id="key-cards-group" opacity="0">
    <!-- Key card 1: Why important -->
    <g id="key-card-0" opacity="0">
      <rect x="60" y="280" width="370" height="110" rx="10" ry="10"
            fill="#252545" stroke="#ff6b35" stroke-width="1.5" filter="url(#cardShadow)"/>
      <text x="80" y="305" fill="#ff6b35"
            font-family="'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="bold">为什么重要</text>
      <text id="key-card-0-text" x="80" y="330" fill="#d0d0e0"
            font-family="'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14"></text>
    </g>
    <!-- Key card 2: Who affected -->
    <g id="key-card-1" opacity="0">
      <rect x="455" y="280" width="370" height="110" rx="10" ry="10"
            fill="#252545" stroke="#35a0ff" stroke-width="1.5" filter="url(#cardShadow)"/>
      <text x="475" y="305" fill="#35a0ff"
            font-family="'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="bold">谁受影响</text>
      <text id="key-card-1-text" x="475" y="330" fill="#d0d0e0"
            font-family="'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14"></text>
    </g>
    <!-- Key card 3: What's next -->
    <g id="key-card-2" opacity="0">
      <rect x="850" y="280" width="370" height="110" rx="10" ry="10"
            fill="#252545" stroke="#50ff80" stroke-width="1.5" filter="url(#cardShadow)"/>
      <text x="870" y="305" fill="#50ff80"
            font-family="'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="bold">接下来怎么看</text>
      <text id="key-card-2-text" x="870" y="330" fill="#d0d0e0"
            font-family="'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14"></text>
    </g>
  </g>

  <!-- CP17: Progress bar -->
  <g id="progress-bar-group" opacity="0">
    <rect id="progress-bg" x="60" y="620" width="1160" height="4" rx="2" ry="2" fill="#2a2a45"/>
    <rect id="progress-fill" x="60" y="620" width="0" height="4" rx="2" ry="2" fill="#ff6b35"/>
  </g>

  <g id="subtitle-group">
    <rect x="{{ render_ir.subtitles.bar.x }}" y="{{ render_ir.subtitles.bar.y }}"
          width="{{ render_ir.subtitles.bar.w }}" height="{{ render_ir.subtitles.bar.h }}"
          fill="rgba(0,0,0,0.75)" rx="8" ry="8"/>
    <text id="subtitle-text" x="{{ render_ir.subtitles.text_x }}" y="{{ render_ir.subtitles.text_y }}"
          text-anchor="middle" fill="#ffffff"
          font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif"
          font-size="{{ render_ir.subtitles.font_size|default(22) }}"></text>
  </g>

  <!-- CP9: Dialogue speaker panels (hidden unless RENDER_IR.dialogue is set) -->
  <g id="speaker-panels" opacity="0">
    <!-- Host card (left side) -->
    <g id="speaker-host" class="speaker-card" transform="translate(60, 160)">
      <rect x="0" y="0" width="180" height="90" rx="12" ry="12"
            fill="rgba(20,59,46,0.85)" stroke="#4db6ac" stroke-width="2"/>
      <!-- Active indicator dot -->
      <circle id="host-indicator" cx="20" cy="20" r="6" fill="#4db6ac" class="active-pulse" opacity="0"/>
      <text x="36" y="26" class="speaker-card-label">主持人</text>
      <text id="host-speaker-name" x="90" y="60" text-anchor="middle" class="speaker-card-name"
            font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif"
            font-size="18" font-weight="bold" fill="#ffffff">主持人</text>
    </g>

    <!-- Expert card (right side) -->
    <g id="speaker-expert" class="speaker-card" transform="translate(1040, 160)">
      <rect x="0" y="0" width="180" height="90" rx="12" ry="12"
            fill="rgba(20,59,46,0.85)" stroke="#f0d77b" stroke-width="2"/>
      <!-- Active indicator dot -->
      <circle id="expert-indicator" cx="20" cy="20" r="6" fill="#f0d77b" class="active-pulse" opacity="0"/>
      <text x="36" y="26" class="speaker-card-label">讲解员</text>
      <text id="expert-speaker-name" x="90" y="60" text-anchor="middle" class="speaker-card-name"
            font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif"
            font-size="18" font-weight="bold" fill="#ffffff">讲解员</text>
    </g>
  </g>
</svg>

<script>
(function () {
  "use strict";

  const RENDER_IR = {{ render_ir_json|safe }};
  const SVG_NS = "http://www.w3.org/2000/svg";

  // CP10: Theme system - fallbacks are chalkboard defaults
  const THEME = RENDER_IR.theme || {};
  const BG = {
    color: THEME.background ? THEME.background.color : "#143b2e",
    grid: THEME.background ? THEME.background.grid_color : "#1f523e",
    type: THEME.background ? THEME.background.type : "grid",
  };
  const TEXT = {
    title: THEME.text ? THEME.text.title : "#f8f8f2",
    body: THEME.text ? THEME.text.body : "#d8e6d4",
    subtitle: THEME.text ? THEME.text.subtitle : "#ffffff",
  };
  const NODE = {
    fill: THEME.node ? THEME.node.fill : "#fff8dc",
    stroke: THEME.node ? THEME.node.stroke : "#f0d77b",
    text: THEME.node ? THEME.node.text : "#1d1d1d",
    badge_fill: (THEME.node && THEME.node.badge_fill) || BG.color,
    badge_text: (THEME.node && THEME.node.badge_text) || TEXT.title,
  };
  // CP11: Node layout style
  const NODE_LAYOUT = {
    style: (THEME.layout && THEME.layout.nodes && THEME.layout.nodes.style) || "chalk_card",
    radius: (THEME.layout && THEME.layout.nodes && THEME.layout.nodes.radius) || 10,
    shadow: (THEME.layout && THEME.layout.nodes && THEME.layout.nodes.shadow) !== false,
    stroke_width: (THEME.layout && THEME.layout.nodes && THEME.layout.nodes.stroke_width) || 3,
  };
  const EDGE = {
    stroke: THEME.edge ? THEME.edge.stroke : "#f8f8f2",
    label: THEME.edge ? THEME.edge.label : "#f8f8f2",
  };
  const CALLOUT = {
    info: {
      fill: THEME.callout ? THEME.callout.info_fill : "#ffe066",
      stroke: THEME.callout ? THEME.callout.info_stroke : "#b58900",
      text: THEME.callout ? THEME.callout.info_text : "#5d4037",
    },
    alert: {
      fill: THEME.callout ? THEME.callout.alert_fill : "#ff8a65",
      stroke: THEME.callout ? THEME.callout.alert_stroke : "#bf360c",
      text: THEME.callout ? THEME.callout.alert_text : "#ffffff",
    },
    positive: {
      fill: THEME.callout ? THEME.callout.positive_fill : "#a5d6a7",
      stroke: THEME.callout ? THEME.callout.positive_stroke : "#2e7d32",
      text: THEME.callout ? THEME.callout.positive_text : "#1b5e20",
    },
  };
  const DIALOGUE_THEME = {
    host_accent: (THEME.dialogue && THEME.dialogue.host_accent) || "#4db6ac",
    expert_accent: (THEME.dialogue && THEME.dialogue.expert_accent) || "#f0d77b",
    host_indicator: (THEME.dialogue && THEME.dialogue.host_indicator) || "#4db6ac",
    expert_indicator: (THEME.dialogue && THEME.dialogue.expert_indicator) || "#f0d77b",
    panel_fill: (THEME.dialogue && THEME.dialogue.panel_fill) || "rgba(20,59,46,0.85)",
    panel_stroke: (THEME.dialogue && THEME.dialogue.panel_stroke) || "#4db6ac",
    subtitle_fill: (THEME.dialogue && THEME.dialogue.subtitle_fill) || "rgba(0,0,0,0.75)",
  };

  // CP17: Detect news_card_v1 variant
  const VARIANT = (THEME.layout && THEME.layout.variant) || "chalkboard_v1";
  const IS_NEWS_CARD = VARIANT === "news_card_v1";

  // CP17: News card config from theme
  // CP18.1: Enhanced with dynamic font sizes and better key card settings
  const NEWS_CARD = {
    breaking_color: (THEME.layout && THEME.layout.news_card && THEME.layout.news_card.breaking_color) || "#ff3535",
    source_y: (THEME.layout && THEME.layout.news_card && THEME.layout.news_card.source_y) || 18,
    title_y: (THEME.layout && THEME.layout.news_card && THEME.layout.news_card.title_y) || 55,
    title_max_chars: (THEME.layout && THEME.layout.news_card && THEME.layout.news_card.title_max_chars) || 22,
    title_max_lines: (THEME.layout && THEME.layout.news_card && THEME.layout.news_card.title_max_lines) || 3,
    title_font_size_1: (THEME.layout && THEME.layout.title && THEME.layout.title.font_size_1_line) || 38,
    title_font_size_2: (THEME.layout && THEME.layout.title && THEME.layout.title.font_size_2_lines) || 34,
    title_font_size_3: (THEME.layout && THEME.layout.title && THEME.layout.title.font_size_3_lines) || 30,
    title_bg: (THEME.layout && THEME.layout.news_card && THEME.layout.news_card.title_bg) || false,
    main_card_y: (THEME.layout && THEME.layout.news_card && THEME.layout.news_card.main_card && THEME.layout.news_card.main_card.y) || 130,
    main_card_h: (THEME.layout && THEME.layout.news_card && THEME.layout.news_card.main_card && THEME.layout.news_card.main_card.h) || 150,
    main_card_label: (THEME.layout && THEME.layout.news_card && THEME.layout.news_card.main_card && THEME.layout.news_card.main_card.label) || "发生了什么",
    main_card_label_font_size: (THEME.layout && THEME.layout.news_card && THEME.layout.news_card.main_card && THEME.layout.news_card.main_card.label_font_size) || 15,
    main_card_content_font_size: (THEME.layout && THEME.layout.news_card && THEME.layout.news_card.main_card && THEME.layout.news_card.main_card.content_font_size) || 17,
    key_cards_y: (THEME.layout && THEME.layout.news_card && THEME.layout.news_card.key_cards && THEME.layout.news_card.key_cards.y) || 300,
    key_cards_h: (THEME.layout && THEME.layout.news_card && THEME.layout.news_card.key_cards && THEME.layout.news_card.key_cards.h) || 130,
    key_cards_gap: (THEME.layout && THEME.layout.news_card && THEME.layout.news_card.key_cards && THEME.layout.news_card.key_cards.gap) || 14,
    key_cards_labels: (THEME.layout && THEME.layout.news_card && THEME.layout.news_card.key_cards && THEME.layout.news_card.key_cards.labels) || ["为什么重要", "谁受影响", "接下来怎么看"],
    key_cards_label_font_size: (THEME.layout && THEME.layout.news_card && THEME.layout.news_card.key_cards && THEME.layout.news_card.key_cards.label_font_size) || 14,
    key_cards_content_font_size: (THEME.layout && THEME.layout.news_card && THEME.layout.news_card.key_cards && THEME.layout.news_card.key_cards.content_font_size) || 15,
    key_cards_max_lines: (THEME.layout && THEME.layout.news_card && THEME.layout.news_card.key_cards && THEME.layout.news_card.key_cards.max_lines) || 3,
    progress_bar_y: (THEME.layout && THEME.layout.news_card && THEME.layout.news_card.progress_bar && THEME.layout.news_card.progress_bar.y) || 620,
    progress_bar_h: (THEME.layout && THEME.layout.news_card && THEME.layout.news_card.progress_bar && THEME.layout.news_card.progress_bar.h) || 5,
    subtitle_y: (THEME.layout && THEME.layout.news_card && THEME.layout.news_card.subtitle && THEME.layout.news_card.subtitle.y) || 640,
    subtitle_h: (THEME.layout && THEME.layout.news_card && THEME.layout.news_card.subtitle && THEME.layout.news_card.subtitle.h) || 55,
    subtitle_font_size: (THEME.layout && THEME.layout.news_card && THEME.layout.news_card.subtitle && THEME.layout.news_card.subtitle.font_size) || 17,
  };

  const board = document.getElementById("board");
  const edgesGroup = document.getElementById("edges-group");
  const nodesGroup = document.getElementById("nodes-group");
  const calloutsGroup = document.getElementById("callouts-group");
  const titleGroup = document.getElementById("title-group");
  const subtitleText = document.getElementById("subtitle-text");

  // CP9: Dialogue visual elements
  const speakerPanels = document.getElementById("speaker-panels");
  const speakerHostCard = document.getElementById("speaker-host");
  const speakerExpertCard = document.getElementById("speaker-expert");
  const hostIndicator = document.getElementById("host-indicator");
  const expertIndicator = document.getElementById("expert-indicator");
  const hostSpeakerName = document.getElementById("host-speaker-name");
  const expertSpeakerName = document.getElementById("expert-speaker-name");

  // CP9: Dialogue state
  const DIALOGUE = RENDER_IR.dialogue || null;
  const DIALOGUE_TURNS = DIALOGUE ? DIALOGUE.turns : null;

  // CP10: Apply theme to static SVG elements at init
  // CP10.1: Use board-bg id to avoid selecting pattern rects or node rects
  function applyTheme() {
    const boardBg = document.getElementById("board-bg");
    if (BG.type === "solid") {
      // Solid background: use solid color, no grid
      if (boardBg) boardBg.setAttribute("fill", BG.color);
    } else {
      // Grid background: use boardGrid pattern, update pattern colors
      if (boardBg) boardBg.setAttribute("fill", "url(#boardGrid)");
      const patternRect = board.querySelector("pattern rect");
      if (patternRect) patternRect.setAttribute("fill", BG.color);
      const gridLines = board.querySelectorAll("pattern line");
      gridLines.forEach(function (l) { l.setAttribute("stroke", BG.grid); });
    }

    // CP16: Title text fitting - max 2 lines, 15 chars per line for Chinese
    // Title max chars based on canvas width (roughly 1 char = 18px at font-size 32)
    const titleFontSize = (THEME.layout && THEME.layout.title && THEME.layout.title.font_size) || 32;
    const canvasW = RENDER_IR.canvas.width;
    const titleMaxChars = Math.floor(canvasW / (titleFontSize * 0.55)) - 4;
    const titleLines = fitTextLines(RENDER_IR.title.text, titleMaxChars, 3);
    for (let i = 0; i < 3; i++) {
      const tspan = document.getElementById("title-line-" + i);
      if (tspan) {
        tspan.textContent = titleLines[i] || "";
      }
    }
    // Apply title font size from theme
    var titleTextEl = document.getElementById("title-text");
    if (titleTextEl) {
      titleTextEl.setAttribute("font-size", String(titleFontSize));
      titleTextEl.setAttribute("fill", TEXT.title);
    }

    // CP16: Summary text fitting - max 2 lines
    const summaryLines = fitTextLines(RENDER_IR.summary.text, 40, 2);
    for (let i = 0; i < 2; i++) {
      const tspan = document.getElementById("summary-line-" + i);
      if (tspan) {
        tspan.textContent = summaryLines[i] || "";
      }
    }
    var summaryTextEl = document.getElementById("summary-text");
    if (summaryTextEl) {
      summaryTextEl.setAttribute("fill", TEXT.body);
    }

    // Subtitle bar fill
    var subtitleBar = document.getElementById("subtitle-group");
    if (subtitleBar) {
      var subtitleBarRect = subtitleBar.querySelector("rect");
      if (subtitleBarRect) subtitleBarRect.setAttribute("fill", DIALOGUE_THEME.subtitle_fill);
      subtitleText.setAttribute("fill", TEXT.subtitle);
    }

    // CP17: Apply news_card_v1 specific theme
    // CP18.1: Enhanced with dynamic font sizes
    if (IS_NEWS_CARD) {
      // Breaking badge color
      var breakingBadge = document.getElementById("breaking-badge");
      if (breakingBadge) breakingBadge.setAttribute("fill", NEWS_CARD.breaking_color);
      var breakingText = document.getElementById("breaking-text");
      if (breakingText) breakingText.setAttribute("fill", "#ffffff");

      // Source text color
      var sourceText = document.getElementById("source-text");
      if (sourceText) sourceText.setAttribute("fill", TEXT.subtitle);

      // Main card styling with font sizes
      var mainCardBg = document.getElementById("main-card-bg");
      if (mainCardBg) {
        mainCardBg.setAttribute("fill", NODE.fill);
        mainCardBg.setAttribute("stroke", NODE.stroke);
      }
      var mainCardLabel = document.getElementById("main-card-label");
      if (mainCardLabel) {
        mainCardLabel.setAttribute("fill", NODE.stroke);
        mainCardLabel.setAttribute("font-size", String(NEWS_CARD.main_card_label_font_size));
      }
      var mainCardTitle = document.getElementById("main-card-title");
      if (mainCardTitle) {
        mainCardTitle.setAttribute("fill", TEXT.title);
        mainCardTitle.setAttribute("font-size", String(NEWS_CARD.main_card_content_font_size));
      }
      var mainCardDesc = document.getElementById("main-card-desc");
      if (mainCardDesc) {
        mainCardDesc.setAttribute("fill", TEXT.body);
        mainCardDesc.setAttribute("font-size", String(NEWS_CARD.main_card_content_font_size - 2));
      }

      // Key cards styling with font sizes
      var keyCardColors = [NODE.stroke, DIALOGUE_THEME.expert_accent, "#50ff80"];
      for (var k = 0; k < 3; k++) {
        var keyCardGroup = document.getElementById("key-card-" + k);
        if (keyCardGroup) {
          var keyCardRect = keyCardGroup.querySelector("rect");
          if (keyCardRect) {
            keyCardRect.setAttribute("fill", NODE.fill);
            keyCardRect.setAttribute("stroke", keyCardColors[k]);
          }
          var keyCardLabelEl = keyCardGroup.querySelector("text");
          if (keyCardLabelEl) {
            keyCardLabelEl.setAttribute("fill", keyCardColors[k]);
            keyCardLabelEl.setAttribute("font-size", String(NEWS_CARD.key_cards_label_font_size));
          }
          var keyCardText = document.getElementById("key-card-" + k + "-text");
          if (keyCardText) {
            keyCardText.setAttribute("fill", TEXT.body);
            keyCardText.setAttribute("font-size", String(NEWS_CARD.key_cards_content_font_size));
          }
        }
      }

      // Progress bar
      var progressFill = document.getElementById("progress-fill");
      if (progressFill) progressFill.setAttribute("fill", NODE.stroke);

      // Subtitle styling
      if (subtitleText) subtitleText.setAttribute("font-size", String(NEWS_CARD.subtitle_font_size));

      // Hide the standard title group (we use news card header instead)
      if (titleGroup) titleGroup.setAttribute("opacity", "0");
    }

    // Speaker panels: apply theme colors
    if (DIALOGUE && DIALOGUE.enabled) {
      // Host panel
      var hostRect = speakerHostCard.querySelector("rect");
      if (hostRect) {
        hostRect.setAttribute("fill", DIALOGUE_THEME.panel_fill);
        hostRect.setAttribute("stroke", DIALOGUE_THEME.panel_stroke);
      }
      if (hostIndicator) {
        hostIndicator.setAttribute("fill", DIALOGUE_THEME.host_indicator);
      }
      // Expert panel
      var expertRect = speakerExpertCard.querySelector("rect");
      if (expertRect) {
        expertRect.setAttribute("fill", DIALOGUE_THEME.panel_fill);
        expertRect.setAttribute("stroke", DIALOGUE_THEME.expert_accent);
      }
      if (expertIndicator) {
        expertIndicator.setAttribute("fill", DIALOGUE_THEME.expert_indicator);
      }
      // Host/expert card text colors
      if (hostSpeakerName) hostSpeakerName.setAttribute("fill", TEXT.title);
      if (expertSpeakerName) expertSpeakerName.setAttribute("fill", TEXT.title);
      // Host/expert labels
      var hostLabel = speakerHostCard.querySelector(".speaker-card-label");
      if (hostLabel) hostLabel.setAttribute("fill", TEXT.title);
      var expertLabel = speakerExpertCard.querySelector(".speaker-card-label");
      if (expertLabel) expertLabel.setAttribute("fill", TEXT.title);
    }
  }

  // CP9: Update speaker panel names from dialogue config
  if (DIALOGUE && DIALOGUE.speakers) {
    if (DIALOGUE.speakers.host) {
      const hostNameEl = hostSpeakerName;
      if (hostNameEl) hostNameEl.textContent = DIALOGUE.speakers.host.name || "主持人";
    }
    if (DIALOGUE.speakers.expert) {
      const expertNameEl = expertSpeakerName;
      if (expertNameEl) expertNameEl.textContent = DIALOGUE.speakers.expert.name || "讲解员";
    }
  }

  // CP9: Show speaker panels only when dialogue is enabled
  if (DIALOGUE && DIALOGUE.enabled) {
    speakerPanels.setAttribute("opacity", "1");

    // CP9.1: Apply panel layout from render_ir.dialogue.speakers
    if (DIALOGUE.speakers) {
      const hostPanel = DIALOGUE.speakers.host ? DIALOGUE.speakers.host.panel : null;
      const expertPanel = DIALOGUE.speakers.expert ? DIALOGUE.speakers.expert.panel : null;

      if (hostPanel) {
        speakerHostCard.setAttribute("transform",
          "translate(" + (hostPanel.x || 60) + ", " + (hostPanel.y || 160) + ")");
        // Update card width if panel w is set
        const hostRect = speakerHostCard.querySelector("rect");
        if (hostRect && hostPanel.w) hostRect.setAttribute("width", String(hostPanel.w));
        if (hostRect && hostPanel.h) hostRect.setAttribute("height", String(hostPanel.h));
      }
      if (expertPanel) {
        speakerExpertCard.setAttribute("transform",
          "translate(" + (expertPanel.x || 1040) + ", " + (expertPanel.y || 160) + ")");
        // Update card width if panel w is set
        const expertRect = speakerExpertCard.querySelector("rect");
        if (expertRect && expertPanel.w) expertRect.setAttribute("width", String(expertPanel.w));
        if (expertRect && expertPanel.h) expertRect.setAttribute("height", String(expertPanel.h));
      }
    }
  }

  applyTheme();

  // CP17: Build news_card_v1 specific elements
  // CP18.1: Dynamic title font size based on line count
  function getTitleFontSize(numLines) {
    if (numLines <= 1) return NEWS_CARD.title_font_size_1 || 38;
    if (numLines === 2) return NEWS_CARD.title_font_size_2 || 34;
    return NEWS_CARD.title_font_size_3 || 30;
  }

  function buildNewsCard() {
    if (!IS_NEWS_CARD) return;

    // Source info from render_ir.meta (if available)
    var sourceText = document.getElementById("source-text");
    if (sourceText) {
      var source = RENDER_IR.meta && RENDER_IR.meta.source ? RENDER_IR.meta.source : "";
      var hotness = RENDER_IR.meta && RENDER_IR.meta.hotness_score ? RENDER_IR.meta.hotness_score : null;
      var parts = [];
      if (source) parts.push(source);
      if (hotness !== null) parts.push("热度 " + hotness);
      sourceText.textContent = parts.join(" · ");
    }

    // Main event card content (from first node)
    // CP18.3: nodes is now declared at module scope, just assign here
    nodes = RENDER_IR.nodes || [];
    if (nodes.length > 0) {
      var mainNode = nodes[0];
      var mainTitle = document.getElementById("main-card-title");
      if (mainTitle) {
        // Use label + sub for main card, up to 3 lines
        var mainLabel = mainNode.label || "";
        var mainSub = mainNode.sub || "";
        var combinedText = mainSub ? mainLabel + "：" + mainSub : mainLabel;
        var titleLines = fitTextLines(combinedText, 32, 3);
        mainTitle.textContent = titleLines.join("\n") || mainLabel;
        // Apply dynamic font size
        var fontSize = getTitleFontSize(titleLines.length);
        mainTitle.setAttribute("font-size", String(fontSize));
      }
      var mainDesc = document.getElementById("main-card-desc");
      if (mainDesc) {
        // Show source URL or hotness in desc if available
        var sourceUrl = RENDER_IR.meta && RENDER_IR.meta.source_url ? RENDER_IR.meta.source_url : "";
        if (sourceUrl) {
          // Shorten URL for display
          var shortUrl = sourceUrl.replace(/^https?:\/\//, "").replace(/\/$/, "").slice(0, 50);
          mainDesc.textContent = shortUrl;
        } else {
          mainDesc.textContent = "";
        }
      }
    }

    // Key cards content (from nodes 1, 2, 3) - show label + sub
    for (var k = 0; k < 3; k++) {
      var keyCardText = document.getElementById("key-card-" + k + "-text");
      if (keyCardText && nodes.length > k + 1) {
        var keyNode = nodes[k + 1];
        var keyLabel = keyNode.label || "";
        var keySub = keyNode.sub || "";
        var keyCombined = keySub ? keyLabel + "\n" + keySub : keyLabel;
        var keyLines = fitTextLines(keyCombined, 16, NEWS_CARD.key_cards_max_lines || 3);
        keyCardText.textContent = keyLines.join("\n") || keyLabel;
      }
    }

    // Update main card background position from theme
    var mainCardBg = document.getElementById("main-card-bg");
    if (mainCardBg) {
      mainCardBg.setAttribute("y", String(NEWS_CARD.main_card_y));
      mainCardBg.setAttribute("height", String(NEWS_CARD.main_card_h));
    }
    var mainCardLabel = document.getElementById("main-card-label");
    if (mainCardLabel) mainCardLabel.setAttribute("y", String(NEWS_CARD.main_card_y + 25));
    var mainCardTitle = document.getElementById("main-card-title");
    if (mainCardTitle) mainCardTitle.setAttribute("y", String(NEWS_CARD.main_card_y + 52));
    var mainCardDesc = document.getElementById("main-card-desc");
    if (mainCardDesc) mainCardDesc.setAttribute("y", String(NEWS_CARD.main_card_y + 90));

    // Update key cards position
    for (var k2 = 0; k2 < 3; k2++) {
      var keyCardGroup = document.getElementById("key-card-" + k2);
      if (keyCardGroup) {
        var cardX = 60 + k2 * (370 + NEWS_CARD.key_cards_gap);
        var rects = keyCardGroup.querySelectorAll("rect");
        var texts = keyCardGroup.querySelectorAll("text");
        if (rects[0]) {
          rects[0].setAttribute("x", String(cardX));
          rects[0].setAttribute("y", String(NEWS_CARD.key_cards_y));
          rects[0].setAttribute("height", String(NEWS_CARD.key_cards_h));
        }
        if (texts[0]) texts[0].setAttribute("x", String(cardX + 20));
        if (texts[0]) texts[0].setAttribute("y", String(NEWS_CARD.key_cards_y + 25));
        var keyCardTextEl = document.getElementById("key-card-" + k2 + "-text");
        if (keyCardTextEl) {
          keyCardTextEl.setAttribute("x", String(cardX + 20));
          keyCardTextEl.setAttribute("y", String(NEWS_CARD.key_cards_y + 52));
        }
      }
    }

    // Progress bar position
    var progressBg = document.getElementById("progress-bg");
    if (progressBg) {
      progressBg.setAttribute("x", "36");
      progressBg.setAttribute("y", String(NEWS_CARD.progress_bar_y));
      progressBg.setAttribute("width", String(RENDER_IR.canvas.width - 72));
      progressBg.setAttribute("height", String(NEWS_CARD.progress_bar_h));
    }
    var progressFill = document.getElementById("progress-fill");
    if (progressFill) {
      progressFill.setAttribute("x", "36");
      progressFill.setAttribute("y", String(NEWS_CARD.progress_bar_y));
      progressFill.setAttribute("height", String(NEWS_CARD.progress_bar_h));
    }

    // Hide standard nodes/callouts for news_card (we use our own card layout)
    nodesGroup.style.display = "none";
    edgesGroup.style.display = "none";
    calloutsGroup.style.display = "none";
  }

  // CP18.3: Declare nodes at module scope so renderFrame can access it
  // even if buildNewsCard returns early
  var nodes = RENDER_IR.nodes || [];

  buildNewsCard();

  // ---------- helpers ----------

  function el(name, attrs, parent) {
    const e = document.createElementNS(SVG_NS, name);
    if (attrs) {
      for (const k in attrs) {
        if (attrs[k] !== null && attrs[k] !== undefined) {
          e.setAttribute(k, attrs[k]);
        }
      }
    }
    if (parent) parent.appendChild(e);
    return e;
  }

  // CP16: Improved text wrapping with mixed Chinese/English support
  function wrapText(text, maxChars) {
    const out = [];
    if (!text) return out;
    const str = String(text);
    let line = "";
    let i = 0;
    while (i < str.length) {
      const ch = str[i];
      // Handle explicit newlines
      if (ch === "\n") {
        if (line) out.push(line);
        line = "";
        i++;
        continue;
      }
      // Check if it's Chinese character (CJK Unified Ideographs)
      const isChinese = /[一-鿿　-〿＀-￯]/.test(ch);
      const charWidth = isChinese ? 1 : 0.6;
      if (line.length + charWidth > maxChars) {
        if (line) out.push(line);
        line = "";
        continue;
      }
      line += ch;
      i++;
    }
    if (line) out.push(line);
    return out;
  }

  // CP16: fitTextLines - fit text to max chars per line and max lines
  // Returns array of lines (max maxLines), with ellipsis if overflow
  function fitTextLines(text, maxCharsPerLine, maxLines) {
    if (!text) return [];
    const str = String(text);
    const rawLines = wrapText(str, maxCharsPerLine);
    if (rawLines.length <= maxLines) return rawLines;
    // Truncate with ellipsis
    const result = rawLines.slice(0, maxLines);
    const lastLine = result[result.length - 1];
    if (lastLine.length > maxCharsPerLine - 1) {
      result[result.length - 1] = lastLine.slice(0, maxCharsPerLine - 1) + "…";
    } else {
      result[result.length - 1] = lastLine + "…";
    }
    return result;
  }

  // ---------- id sets used to interpret timeline.reveal ----------

  const NODE_IDS = new Set(RENDER_IR.nodes.map(function (n) { return n.id; }));
  const EDGE_IDS = new Set(RENDER_IR.edges.map(function (e) { return e.id; }));
  const CALLOUT_IDS = new Set(RENDER_IR.callouts.map(function (c) { return c.id; }));

  // ---------- build static structure ----------

  // Edges (each is its own group so the line + label fade together)
  RENDER_IR.edges.forEach(function (edge) {
    const g = el("g", {
      opacity: 0,
      "data-edge-id": edge.id,
    }, edgesGroup);

    el("line", {
      x1: edge.x1, y1: edge.y1,
      x2: edge.x2, y2: edge.y2,
      stroke: EDGE.stroke,
      "stroke-width": 3,
      "marker-end": "url(#arrowhead)",
    }, g);

    if (edge.label) {
      const midX = (edge.x1 + edge.x2) / 2;
      const midY = (edge.y1 + edge.y2) / 2;
      const t = el("text", {
        x: midX,
        y: midY - 8,
        "text-anchor": "middle",
        fill: EDGE.label,
        "font-family": "Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif",
        "font-size": 14,
        opacity: 0.85,
      }, g);
      t.textContent = edge.label;
    }
  });

  // Nodes
  RENDER_IR.nodes.forEach(function (node) {
    const g = el("g", {
      opacity: 0,
      "data-node-id": node.id,
    }, nodesGroup);

    // CP16: Use theme variant to determine node shape
    // causal_map_v1 uses circular nodes; others use rounded rects
    const variant = (THEME.layout && THEME.layout.variant) || "chalkboard_v1";
    const isCircleNode = variant === "causal_map_v1";

    if (isCircleNode) {
      // Circular node for causal_map_v1
      const cx = node.cx;
      const cy = node.cy;
      const r = Math.min(node.w, node.h) / 2 - 4;
      el("circle", {
        cx: cx, cy: cy, r: r,
        fill: NODE.fill,
        stroke: NODE.stroke,
        "stroke-width": NODE_LAYOUT.stroke_width,
        filter: NODE_LAYOUT.shadow ? "url(#cardShadow)" : null,
      }, g);

      // Index badge (centered circle at top)
      const idx = (RENDER_IR.nodes.indexOf(node) + 1).toString();
      el("circle", {
        cx: cx, cy: node.y + 30, r: 14,
        fill: NODE.badge_fill,
        stroke: NODE.stroke,
        "stroke-width": 2,
      }, g);
      el("text", {
        x: cx, y: node.y + 35,
        "text-anchor": "middle",
        fill: NODE.badge_text,
        "font-family": "Arial, sans-serif",
        "font-size": 16,
        "font-weight": "bold",
      }, g).textContent = idx;

      // Label (inside circle, up to 2 lines)
      const labelLines = fitTextLines(node.label || "", 6, 2);
      let baseY = cy - 8;
      labelLines.forEach(function (line, i) {
        const t = el("text", {
          x: cx,
          y: baseY + i * 22,
          "text-anchor": "middle",
          fill: NODE.text,
          "font-family": "'PingFang SC', 'Microsoft YaHei', sans-serif",
          "font-size": 16,
          "font-weight": "bold",
        }, g);
        t.textContent = line;
      });

      // Sub line (below label)
      if (node.sub) {
        const subLines = fitTextLines(node.sub, 10, 1);
        const subY = baseY + labelLines.length * 22 + 4;
        subLines.forEach(function (line) {
          const t = el("text", {
            x: cx,
            y: subY,
            "text-anchor": "middle",
            fill: TEXT.body,
            "font-family": "Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif",
            "font-size": 12,
          }, g);
          t.textContent = line;
        });
      }
    } else {
      // Rect node for other themes
      el("rect", {
        x: node.x, y: node.y, width: node.w, height: node.h,
        rx: NODE_LAYOUT.radius, ry: NODE_LAYOUT.radius,
        fill: NODE.fill,
        stroke: NODE.stroke,
        "stroke-width": NODE_LAYOUT.stroke_width,
        filter: NODE_LAYOUT.shadow ? "url(#cardShadow)" : null,
      }, g);

      // Index badge (1-based) - CP10.1: use NODE.badge_fill / badge_text for contrast
      const idx = (RENDER_IR.nodes.indexOf(node) + 1).toString();
      el("circle", {
        cx: node.x + 22, cy: node.y + 22, r: 16,
        fill: NODE.badge_fill,
        stroke: NODE.stroke,
        "stroke-width": 2,
      }, g);
      el("text", {
        x: node.x + 22, y: node.y + 28,
        "text-anchor": "middle",
        fill: NODE.badge_text,
        "font-family": "Arial, sans-serif",
        "font-size": 18,
        "font-weight": "bold",
      }, g).textContent = idx;

      // Label (wrapped, up to 3 lines)
      const labelLines = fitTextLines(node.label || "", 8, 3);
      let baseY = node.y + 64;
      if (node.sub) baseY -= 8;
      labelLines.forEach(function (line, i) {
        const t = el("text", {
          x: node.cx,
          y: baseY + i * 24,
          "text-anchor": "middle",
          fill: NODE.text,
          "font-family": "'PingFang SC', 'Microsoft YaHei', sans-serif",
          "font-size": 18,
          "font-weight": "bold",
        }, g);
        t.textContent = line;
      });

      // Sub line (single line, smaller)
      if (node.sub) {
        const subY = baseY + labelLines.length * 24 + 4;
        const subLines = fitTextLines(node.sub, 14, 1);
        subLines.forEach(function (line) {
          const t = el("text", {
            x: node.cx,
            y: subY,
            "text-anchor": "middle",
            fill: TEXT.body,
            "font-family": "Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif",
            "font-size": 13,
          }, g);
          t.textContent = line;
        });
      }
    }
  });

  // Callouts
  RENDER_IR.callouts.forEach(function (callout) {
    const g = el("g", {
      opacity: 0,
      "data-callout-id": callout.id,
    }, calloutsGroup);

    // Color by tone (CP10: use THEME.callout)
    var cfill = CALLOUT.info.fill;
    var cstroke = CALLOUT.info.stroke;
    var ctext = CALLOUT.info.text;
    if (callout.tone === "alert")   { cfill = CALLOUT.alert.fill; cstroke = CALLOUT.alert.stroke; ctext = CALLOUT.alert.text; }
    if (callout.tone === "positive"){ cfill = CALLOUT.positive.fill; cstroke = CALLOUT.positive.stroke; ctext = CALLOUT.positive.text; }

    el("rect", {
      x: callout.x, y: callout.y,
      width: callout.w, height: callout.h,
      rx: 8, ry: 8,
      fill: cfill,
      stroke: cstroke,
      "stroke-width": 2,
      filter: "url(#cardShadow)",
    }, g);

    // Connector to node
    const target = RENDER_IR.nodes.find(function (n) { return n.id === callout.on; });
    if (target) {
      el("line", {
        x1: callout.x + callout.w / 2,
        y1: callout.y + callout.h,
        x2: callout.x + callout.w / 2,
        y2: target.y - 2,
        stroke: cstroke,
        "stroke-width": 2,
        "stroke-dasharray": "4 4",
      }, g);
    }

    const textLines = fitTextLines(callout.text || "", 10, 2);
    const cy = callout.y + callout.h / 2;
    textLines.forEach(function (line, i) {
      const offset = (i - (textLines.length - 1) / 2) * 18;
      const t = el("text", {
        x: callout.x + callout.w / 2,
        y: cy + offset,
        "text-anchor": "middle",
        fill: ctext,
        "font-family": "Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif",
        "font-size": 14,
        "font-weight": "bold",
      }, g);
      t.textContent = line;
    });
  });

  // ---------- animation ----------

  // Reveal sets are recomputed each frame from the timeline (monotonic).
  const DIM_OPACITY = 0.62;  // already-shown but not the current beat
  const FADE_IN = 0.4;       // seconds

  let isPaused = false;
  let currentTime = 0;
  let startTimestamp = null;

  function renderFrame(t) {
    currentTime = t;

    // Current beat
    let currentBeat = null;
    for (let i = 0; i < RENDER_IR.timeline.length; i++) {
      const tt = RENDER_IR.timeline[i];
      if (t >= tt.at && t < tt.at + tt.duration) {
        currentBeat = tt;
        break;
      }
    }

    // Compute revealed sets: every beat whose at <= t contributes its reveal.
    const revealedTitle = RENDER_IR.timeline.some(function (tt) {
      return tt.at <= t && tt.reveal === "title";
    });
    const revealedNodes = new Set();
    const revealedEdges = new Set();
    const revealedCallouts = new Set();
    for (let i = 0; i < RENDER_IR.timeline.length; i++) {
      const tt = RENDER_IR.timeline[i];
      if (tt.at > t) break;
      const r = tt.reveal;
      if (r === "title") continue;
      if (NODE_IDS.has(r))     revealedNodes.add(r);
      else if (EDGE_IDS.has(r))    revealedEdges.add(r);
      else if (CALLOUT_IDS.has(r)) revealedCallouts.add(r);
      // unknown reveal strings are ignored on purpose
    }

    // Title group: shown from first 'title' beat onward, stays at full opacity.
    if (!revealedTitle) {
      titleGroup.setAttribute("opacity", 0);
    } else if (currentBeat && currentBeat.reveal === "title") {
      const into = t - currentBeat.at;
      titleGroup.setAttribute("opacity", Math.min(1, into / FADE_IN).toFixed(3));
    } else {
      titleGroup.setAttribute("opacity", 1);
    }

    // Helper: pick opacity for a given id, given its revealed set
    function opFor(revealedSet, id, isCallout) {
      if (!revealedSet.has(id)) return 0;
      const baseDim = isCallout ? 0.72 : DIM_OPACITY;
      if (currentBeat && currentBeat.reveal === id) {
        const into = t - currentBeat.at;
        return Math.min(1, into / FADE_IN);
      }
      return baseDim;
    }

    // Nodes
    RENDER_IR.nodes.forEach(function (node) {
      const g = nodesGroup.querySelector('g[data-node-id="' + node.id + '"]');
      if (!g) return;
      g.setAttribute("opacity", opFor(revealedNodes, node.id, false).toFixed(3));
    });

    // Edges
    RENDER_IR.edges.forEach(function (edge) {
      const g = edgesGroup.querySelector('g[data-edge-id="' + edge.id + '"]');
      if (!g) return;
      g.setAttribute("opacity", opFor(revealedEdges, edge.id, false).toFixed(3));
    });

    // Callouts
    RENDER_IR.callouts.forEach(function (callout) {
      const g = calloutsGroup.querySelector('g[data-callout-id="' + callout.id + '"]');
      if (!g) return;
      g.setAttribute("opacity", opFor(revealedCallouts, callout.id, true).toFixed(3));
    });

    // CP17: News card animation
    // CP18.1: Enhanced with staggered key card reveals and beat highlighting
    if (IS_NEWS_CARD) {
      const newsCardHeader = document.getElementById("news-card-header");
      const mainEventCard = document.getElementById("main-event-card");
      const keyCardsGroup = document.getElementById("key-cards-group");
      const progressBarGroup = document.getElementById("progress-bar-group");

      // Title beat reveals header with fade in
      if (revealedTitle) {
        const headerOpacity = currentBeat && currentBeat.reveal === "title"
          ? Math.min(1, (t - currentBeat.at) / FADE_IN).toFixed(3)
          : "1";
        if (newsCardHeader) newsCardHeader.setAttribute("opacity", headerOpacity);
      }

      // First node reveals main event card
      const mainReveal = revealedNodes.has(nodes[0] ? nodes[0].id : "");
      if (mainReveal) {
        const mainOpacity = currentBeat && currentBeat.reveal === nodes[0].id
          ? Math.min(1, (t - currentBeat.at) / FADE_IN).toFixed(3)
          : "1";
        if (mainEventCard) mainEventCard.setAttribute("opacity", mainOpacity);
      }

      // Key cards: reveal when 2+ nodes are shown
      const keyCardRevealed = nodes.length > 1 && revealedNodes.has(nodes[1] ? nodes[1].id : "");
      if (keyCardRevealed) {
        if (keyCardsGroup) keyCardsGroup.setAttribute("opacity", "1");

        // Stagger individual key cards with delay
        const STAGGER_DELAY = 0.15; // seconds between each card
        for (let k = 0; k < 3; k++) {
          const keyCardGroup = document.getElementById("key-card-" + k);
          if (!keyCardGroup) continue;

          const nodeId = k === 0 ? nodes[1]?.id : k === 1 ? nodes[2]?.id : nodes[3]?.id;
          const isRevealed = nodeId && revealedNodes.has(nodeId);

          if (isRevealed) {
            // Find when this node was first revealed
            let cardRevealTime = 0;
            for (let i = 0; i < RENDER_IR.timeline.length; i++) {
              const tt = RENDER_IR.timeline[i];
              if (tt.at > t) break;
              if (tt.reveal === nodeId) {
                cardRevealTime = tt.at;
                break;
              }
            }
            const cardElapsed = t - cardRevealTime;
            const cardDelay = k * STAGGER_DELAY;
            const cardOpacity = cardElapsed >= cardDelay
              ? Math.min(1, (cardElapsed - cardDelay) / FADE_IN).toFixed(3)
              : "0";
            keyCardGroup.setAttribute("opacity", cardOpacity);

            // Highlight current beat card with enhanced stroke
            const isCurrentBeat = currentBeat && currentBeat.reveal === nodeId;
            const keyCardRect = keyCardGroup.querySelector("rect");
            if (keyCardRect) {
              keyCardRect.setAttribute("stroke-width", isCurrentBeat ? "3" : "1.5");
            }
          } else {
            keyCardGroup.setAttribute("opacity", "0");
          }
        }
      }

      // Progress bar with smooth fill
      if (progressBarGroup) {
        progressBarGroup.setAttribute("opacity", "1");
        const totalDuration = RENDER_IR.total_duration || 1;
        const progress = Math.min(1, t / totalDuration);
        const progressFill = document.getElementById("progress-fill");
        if (progressFill) {
          progressFill.setAttribute("width", String(Math.round(progress * (RENDER_IR.canvas.width - 72))));
        }
      }
    }

    // Subtitle = current beat's narration (or dialogue turn text if dialogue enabled)
    // CP9: Handle dialogue turn subtitle and speaker highlighting
    if (DIALOGUE_TURNS && DIALOGUE_TURNS.length > 0) {
      let activeTurn = null;
      for (let i = 0; i < DIALOGUE_TURNS.length; i++) {
        const turn = DIALOGUE_TURNS[i];
        if (t >= turn.start && t < turn.end) {
          activeTurn = turn;
          break;
        }
      }

      if (activeTurn) {
        subtitleText.textContent = activeTurn.text || "";
        // Highlight active speaker
        if (activeTurn.speaker === "host") {
          speakerHostCard.classList.add("active");
          speakerExpertCard.classList.remove("active");
          hostIndicator.setAttribute("opacity", "1");
          expertIndicator.setAttribute("opacity", "0");
        } else if (activeTurn.speaker === "expert") {
          speakerExpertCard.classList.add("active");
          speakerHostCard.classList.remove("active");
          expertIndicator.setAttribute("opacity", "1");
          hostIndicator.setAttribute("opacity", "0");
        } else {
          speakerHostCard.classList.remove("active");
          speakerExpertCard.classList.remove("active");
          hostIndicator.setAttribute("opacity", "0");
          expertIndicator.setAttribute("opacity", "0");
        }
      } else {
        // No active turn — dim both speakers
        subtitleText.textContent = "";
        speakerHostCard.classList.remove("active");
        speakerExpertCard.classList.remove("active");
        hostIndicator.setAttribute("opacity", "0");
        expertIndicator.setAttribute("opacity", "0");
      }
    } else {
      subtitleText.textContent = currentBeat ? currentBeat.narration : "";
    }
  }

  // Expose controls for the exporter
  window.__setTime__ = function (t) {
    isPaused = true;
    renderFrame(t);
  };
  window.__getTotalDuration__ = function () {
    return RENDER_IR.total_duration + 1.0; // 1s tail
  };

  function loop(ts) {
    if (!isPaused) {
      if (startTimestamp === null) startTimestamp = ts;
      const elapsed = (ts - startTimestamp) / 1000;
      renderFrame(elapsed);
    }
    requestAnimationFrame(loop);
  }

  renderFrame(0);
  window.__ANIMATION_READY__ = true;
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
