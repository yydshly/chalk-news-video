<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>chalk-news-video animation</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #000;
    overflow: hidden;
  }
  svg.board {
    display: block;
    background: #143b2e;
  }

  /* CP9: Dialogue speaker cards */
  .speaker-card {
    opacity: 0.55;
    transition: opacity 0.3s ease;
  }
  .speaker-card.active {
    opacity: 1;
  }
  .speaker-card-label {
    font-family: Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif;
    font-size: 14px;
    fill: #f8f8f2;
  }
  .speaker-card-name {
    font-family: Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif;
    font-size: 18px;
    font-weight: bold;
    fill: #ffffff;
  }
  .active-pulse {
    animation: pulse 1.2s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }
</style>
</head>
<body>
<svg id="board" class="board" xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 {{ render_ir.canvas.width }} {{ render_ir.canvas.height }}"
     width="{{ render_ir.canvas.width }}" height="{{ render_ir.canvas.height }}">

  <defs>
    <pattern id="boardGrid" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <rect width="40" height="40" fill="#143b2e"/>
      <line x1="0" y1="0" x2="40" y2="0" stroke="#1f523e" stroke-width="1"/>
      <line x1="0" y1="0" x2="0" y2="40" stroke="#1f523e" stroke-width="1"/>
    </pattern>

    <filter id="chalkRough" x="-2%" y="-2%" width="104%" height="104%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" result="t"/>
      <feDisplacementMap in="SourceGraphic" in2="t" scale="0.8"/>
    </filter>

    <marker id="arrowhead" markerWidth="12" markerHeight="12"
            refX="10" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L0,8 L10,4 z" fill="#f8f8f2"/>
    </marker>

    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect id="board-bg" width="{{ render_ir.canvas.width }}" height="{{ render_ir.canvas.height }}"
        fill="url(#boardGrid)"/>

  <!-- Title group: fades in once on the first beat that reveals 'title', then stays -->
  <g id="title-group" opacity="0">
    <text id="title-text" x="{{ render_ir.title.x }}" y="{{ render_ir.title.y }}"
          text-anchor="middle" fill="#f8f8f2"
          font-family="'Comic Sans MS', 'Chalkboard SE', 'Comic Neue', cursive, sans-serif"
          font-size="36" font-weight="bold" filter="url(#chalkRough)">{{ render_ir.title.text }}</text>
    <text id="summary-text" x="{{ render_ir.summary.x }}" y="{{ render_ir.summary.y }}"
          text-anchor="middle" fill="#d8e6d4"
          font-family="'Comic Sans MS', 'Chalkboard SE', cursive, sans-serif"
          font-size="20" filter="url(#chalkRough)">{{ render_ir.summary.text }}</text>
  </g>

  <g id="edges-group"></g>
  <g id="nodes-group"></g>
  <g id="callouts-group"></g>

  <g id="subtitle-group">
    <rect x="{{ render_ir.subtitles.bar.x }}" y="{{ render_ir.subtitles.bar.y }}"
          width="{{ render_ir.subtitles.bar.w }}" height="{{ render_ir.subtitles.bar.h }}"
          fill="rgba(0,0,0,0.75)" rx="8" ry="8"/>
    <text id="subtitle-text" x="{{ render_ir.subtitles.text_x }}" y="{{ render_ir.subtitles.text_y }}"
          text-anchor="middle" fill="#ffffff"
          font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif"
          font-size="22"></text>
  </g>

  <!-- CP9: Dialogue speaker panels (hidden unless RENDER_IR.dialogue is set) -->
  <g id="speaker-panels" opacity="0">
    <!-- Host card (left side) -->
    <g id="speaker-host" class="speaker-card" transform="translate(60, 160)">
      <rect x="0" y="0" width="180" height="90" rx="12" ry="12"
            fill="rgba(20,59,46,0.85)" stroke="#4db6ac" stroke-width="2"/>
      <!-- Active indicator dot -->
      <circle id="host-indicator" cx="20" cy="20" r="6" fill="#4db6ac" class="active-pulse" opacity="0"/>
      <text x="36" y="26" class="speaker-card-label">主持人</text>
      <text id="host-speaker-name" x="90" y="60" text-anchor="middle" class="speaker-card-name"
            font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif"
            font-size="18" font-weight="bold" fill="#ffffff">主持人</text>
    </g>

    <!-- Expert card (right side) -->
    <g id="speaker-expert" class="speaker-card" transform="translate(1040, 160)">
      <rect x="0" y="0" width="180" height="90" rx="12" ry="12"
            fill="rgba(20,59,46,0.85)" stroke="#f0d77b" stroke-width="2"/>
      <!-- Active indicator dot -->
      <circle id="expert-indicator" cx="20" cy="20" r="6" fill="#f0d77b" class="active-pulse" opacity="0"/>
      <text x="36" y="26" class="speaker-card-label">讲解员</text>
      <text id="expert-speaker-name" x="90" y="60" text-anchor="middle" class="speaker-card-name"
            font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif"
            font-size="18" font-weight="bold" fill="#ffffff">讲解员</text>
    </g>
  </g>
</svg>

<script>
(function () {
  "use strict";

  const RENDER_IR = {{ render_ir_json|safe }};
  const SVG_NS = "http://www.w3.org/2000/svg";

  // CP10: Theme system - fallbacks are chalkboard defaults
  const THEME = RENDER_IR.theme || {};
  const BG = {
    color: THEME.background ? THEME.background.color : "#143b2e",
    grid: THEME.background ? THEME.background.grid_color : "#1f523e",
    type: THEME.background ? THEME.background.type : "grid",
  };
  const TEXT = {
    title: THEME.text ? THEME.text.title : "#f8f8f2",
    body: THEME.text ? THEME.text.body : "#d8e6d4",
    subtitle: THEME.text ? THEME.text.subtitle : "#ffffff",
  };
  const NODE = {
    fill: THEME.node ? THEME.node.fill : "#fff8dc",
    stroke: THEME.node ? THEME.node.stroke : "#f0d77b",
    text: THEME.node ? THEME.node.text : "#1d1d1d",
    badge_fill: (THEME.node && THEME.node.badge_fill) || BG.color,
    badge_text: (THEME.node && THEME.node.badge_text) || TEXT.title,
  };
  const EDGE = {
    stroke: THEME.edge ? THEME.edge.stroke : "#f8f8f2",
    label: THEME.edge ? THEME.edge.label : "#f8f8f2",
  };
  const CALLOUT = {
    info: {
      fill: THEME.callout ? THEME.callout.info_fill : "#ffe066",
      stroke: THEME.callout ? THEME.callout.info_stroke : "#b58900",
      text: THEME.callout ? THEME.callout.info_text : "#5d4037",
    },
    alert: {
      fill: THEME.callout ? THEME.callout.alert_fill : "#ff8a65",
      stroke: THEME.callout ? THEME.callout.alert_stroke : "#bf360c",
      text: THEME.callout ? THEME.callout.alert_text : "#ffffff",
    },
    positive: {
      fill: THEME.callout ? THEME.callout.positive_fill : "#a5d6a7",
      stroke: THEME.callout ? THEME.callout.positive_stroke : "#2e7d32",
      text: THEME.callout ? THEME.callout.positive_text : "#1b5e20",
    },
  };
  const DIALOGUE_THEME = {
    host_accent: (THEME.dialogue && THEME.dialogue.host_accent) || "#4db6ac",
    expert_accent: (THEME.dialogue && THEME.dialogue.expert_accent) || "#f0d77b",
    host_indicator: (THEME.dialogue && THEME.dialogue.host_indicator) || "#4db6ac",
    expert_indicator: (THEME.dialogue && THEME.dialogue.expert_indicator) || "#f0d77b",
    panel_fill: (THEME.dialogue && THEME.dialogue.panel_fill) || "rgba(20,59,46,0.85)",
    panel_stroke: (THEME.dialogue && THEME.dialogue.panel_stroke) || "#4db6ac",
    subtitle_fill: (THEME.dialogue && THEME.dialogue.subtitle_fill) || "rgba(0,0,0,0.75)",
  };

  const board = document.getElementById("board");
  const edgesGroup = document.getElementById("edges-group");
  const nodesGroup = document.getElementById("nodes-group");
  const calloutsGroup = document.getElementById("callouts-group");
  const titleGroup = document.getElementById("title-group");
  const subtitleText = document.getElementById("subtitle-text");

  // CP9: Dialogue visual elements
  const speakerPanels = document.getElementById("speaker-panels");
  const speakerHostCard = document.getElementById("speaker-host");
  const speakerExpertCard = document.getElementById("speaker-expert");
  const hostIndicator = document.getElementById("host-indicator");
  const expertIndicator = document.getElementById("expert-indicator");
  const hostSpeakerName = document.getElementById("host-speaker-name");
  const expertSpeakerName = document.getElementById("expert-speaker-name");

  // CP9: Dialogue state
  const DIALOGUE = RENDER_IR.dialogue || null;
  const DIALOGUE_TURNS = DIALOGUE ? DIALOGUE.turns : null;

  // CP10: Apply theme to static SVG elements at init
  // CP10.1: Use board-bg id to avoid selecting pattern rects or node rects
  function applyTheme() {
    const boardBg = document.getElementById("board-bg");
    if (BG.type === "solid") {
      // Solid background: use solid color, no grid
      if (boardBg) boardBg.setAttribute("fill", BG.color);
    } else {
      // Grid background: use boardGrid pattern, update pattern colors
      if (boardBg) boardBg.setAttribute("fill", "url(#boardGrid)");
      const patternRect = board.querySelector("pattern rect");
      if (patternRect) patternRect.setAttribute("fill", BG.color);
      const gridLines = board.querySelectorAll("pattern line");
      gridLines.forEach(function (l) { l.setAttribute("stroke", BG.grid); });
    }

    // Title / summary text color
    var titleTexts = titleGroup.querySelectorAll("text");
    if (titleTexts[0]) titleTexts[0].setAttribute("fill", TEXT.title);
    if (titleTexts[1]) titleTexts[1].setAttribute("fill", TEXT.body);

    // Subtitle bar fill
    var subtitleBar = document.getElementById("subtitle-group");
    if (subtitleBar) {
      var subtitleBarRect = subtitleBar.querySelector("rect");
      if (subtitleBarRect) subtitleBarRect.setAttribute("fill", DIALOGUE_THEME.subtitle_fill);
      subtitleText.setAttribute("fill", TEXT.subtitle);
    }

    // Speaker panels: apply theme colors
    if (DIALOGUE && DIALOGUE.enabled) {
      // Host panel
      var hostRect = speakerHostCard.querySelector("rect");
      if (hostRect) {
        hostRect.setAttribute("fill", DIALOGUE_THEME.panel_fill);
        hostRect.setAttribute("stroke", DIALOGUE_THEME.panel_stroke);
      }
      if (hostIndicator) {
        hostIndicator.setAttribute("fill", DIALOGUE_THEME.host_indicator);
      }
      // Expert panel
      var expertRect = speakerExpertCard.querySelector("rect");
      if (expertRect) {
        expertRect.setAttribute("fill", DIALOGUE_THEME.panel_fill);
        expertRect.setAttribute("stroke", DIALOGUE_THEME.expert_accent);
      }
      if (expertIndicator) {
        expertIndicator.setAttribute("fill", DIALOGUE_THEME.expert_indicator);
      }
      // Host/expert card text colors
      if (hostSpeakerName) hostSpeakerName.setAttribute("fill", TEXT.title);
      if (expertSpeakerName) expertSpeakerName.setAttribute("fill", TEXT.title);
      // Host/expert labels
      var hostLabel = speakerHostCard.querySelector(".speaker-card-label");
      if (hostLabel) hostLabel.setAttribute("fill", TEXT.title);
      var expertLabel = speakerExpertCard.querySelector(".speaker-card-label");
      if (expertLabel) expertLabel.setAttribute("fill", TEXT.title);
    }
  }

  // CP9: Update speaker panel names from dialogue config
  if (DIALOGUE && DIALOGUE.speakers) {
    if (DIALOGUE.speakers.host) {
      const hostNameEl = hostSpeakerName;
      if (hostNameEl) hostNameEl.textContent = DIALOGUE.speakers.host.name || "主持人";
    }
    if (DIALOGUE.speakers.expert) {
      const expertNameEl = expertSpeakerName;
      if (expertNameEl) expertNameEl.textContent = DIALOGUE.speakers.expert.name || "讲解员";
    }
  }

  // CP9: Show speaker panels only when dialogue is enabled
  if (DIALOGUE && DIALOGUE.enabled) {
    speakerPanels.setAttribute("opacity", "1");

    // CP9.1: Apply panel layout from render_ir.dialogue.speakers
    if (DIALOGUE.speakers) {
      const hostPanel = DIALOGUE.speakers.host ? DIALOGUE.speakers.host.panel : null;
      const expertPanel = DIALOGUE.speakers.expert ? DIALOGUE.speakers.expert.panel : null;

      if (hostPanel) {
        speakerHostCard.setAttribute("transform",
          "translate(" + (hostPanel.x || 60) + ", " + (hostPanel.y || 160) + ")");
        // Update card width if panel w is set
        const hostRect = speakerHostCard.querySelector("rect");
        if (hostRect && hostPanel.w) hostRect.setAttribute("width", String(hostPanel.w));
        if (hostRect && hostPanel.h) hostRect.setAttribute("height", String(hostPanel.h));
      }
      if (expertPanel) {
        speakerExpertCard.setAttribute("transform",
          "translate(" + (expertPanel.x || 1040) + ", " + (expertPanel.y || 160) + ")");
        // Update card width if panel w is set
        const expertRect = speakerExpertCard.querySelector("rect");
        if (expertRect && expertPanel.w) expertRect.setAttribute("width", String(expertPanel.w));
        if (expertRect && expertPanel.h) expertRect.setAttribute("height", String(expertPanel.h));
      }
    }
  }

  applyTheme();

  // ---------- helpers ----------

  function el(name, attrs, parent) {
    const e = document.createElementNS(SVG_NS, name);
    if (attrs) {
      for (const k in attrs) {
        if (attrs[k] !== null && attrs[k] !== undefined) {
          e.setAttribute(k, attrs[k]);
        }
      }
    }
    if (parent) parent.appendChild(e);
    return e;
  }

  function wrapText(text, maxChars) {
    const out = [];
    if (!text) return out;
    let line = "";
    for (const ch of String(text)) {
      if (ch === "\n") { out.push(line); line = ""; continue; }
      if (line.length >= maxChars) { out.push(line); line = ""; }
      line += ch;
    }
    if (line) out.push(line);
    return out;
  }

  // ---------- id sets used to interpret timeline.reveal ----------

  const NODE_IDS = new Set(RENDER_IR.nodes.map(function (n) { return n.id; }));
  const EDGE_IDS = new Set(RENDER_IR.edges.map(function (e) { return e.id; }));
  const CALLOUT_IDS = new Set(RENDER_IR.callouts.map(function (c) { return c.id; }));

  // ---------- build static structure ----------

  // Edges (each is its own group so the line + label fade together)
  RENDER_IR.edges.forEach(function (edge) {
    const g = el("g", {
      opacity: 0,
      "data-edge-id": edge.id,
    }, edgesGroup);

    el("line", {
      x1: edge.x1, y1: edge.y1,
      x2: edge.x2, y2: edge.y2,
      stroke: EDGE.stroke,
      "stroke-width": 3,
      "marker-end": "url(#arrowhead)",
    }, g);

    if (edge.label) {
      const midX = (edge.x1 + edge.x2) / 2;
      const midY = (edge.y1 + edge.y2) / 2;
      const t = el("text", {
        x: midX,
        y: midY - 8,
        "text-anchor": "middle",
        fill: EDGE.label,
        "font-family": "Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif",
        "font-size": 14,
        opacity: 0.85,
      }, g);
      t.textContent = edge.label;
    }
  });

  // Nodes
  RENDER_IR.nodes.forEach(function (node) {
    const g = el("g", {
      opacity: 0,
      "data-node-id": node.id,
    }, nodesGroup);

    el("rect", {
      x: node.x, y: node.y, width: node.w, height: node.h,
      rx: 10, ry: 10,
      fill: NODE.fill,
      stroke: NODE.stroke,
      "stroke-width": 3,
      filter: "url(#cardShadow)",
    }, g);

    // Index badge (1-based) - CP10.1: use NODE.badge_fill / badge_text for contrast
    const idx = (RENDER_IR.nodes.indexOf(node) + 1).toString();
    el("circle", {
      cx: node.x + 22, cy: node.y + 22, r: 16,
      fill: NODE.badge_fill,
      stroke: NODE.stroke,
      "stroke-width": 2,
    }, g);
    el("text", {
      x: node.x + 22, y: node.y + 28,
      "text-anchor": "middle",
      fill: NODE.badge_text,
      "font-family": "Arial, sans-serif",
      "font-size": 18,
      "font-weight": "bold",
    }, g).textContent = idx;

    // Label (wrapped, up to 3 lines)
    const labelLines = wrapText(node.label || "", 8).slice(0, 3);
    let baseY = node.y + 64;
    if (node.sub) baseY -= 8;
    labelLines.forEach(function (line, i) {
      const t = el("text", {
        x: node.cx,
        y: baseY + i * 24,
        "text-anchor": "middle",
        fill: NODE.text,
        "font-family": "'Comic Sans MS', 'Chalkboard SE', cursive, sans-serif",
        "font-size": 18,
        "font-weight": "bold",
      }, g);
      t.textContent = line;
    });

    // Sub line (single line, smaller)
    if (node.sub) {
      const subY = baseY + labelLines.length * 24 + 4;
      const subLines = wrapText(node.sub, 14).slice(0, 1);
      subLines.forEach(function (line) {
        const t = el("text", {
          x: node.cx,
          y: subY,
          "text-anchor": "middle",
          fill: TEXT.body,
          "font-family": "Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif",
          "font-size": 13,
        }, g);
        t.textContent = line;
      });
    }
  });

  // Callouts
  RENDER_IR.callouts.forEach(function (callout) {
    const g = el("g", {
      opacity: 0,
      "data-callout-id": callout.id,
    }, calloutsGroup);

    // Color by tone (CP10: use THEME.callout)
    var cfill = CALLOUT.info.fill;
    var cstroke = CALLOUT.info.stroke;
    var ctext = CALLOUT.info.text;
    if (callout.tone === "alert")   { cfill = CALLOUT.alert.fill; cstroke = CALLOUT.alert.stroke; ctext = CALLOUT.alert.text; }
    if (callout.tone === "positive"){ cfill = CALLOUT.positive.fill; cstroke = CALLOUT.positive.stroke; ctext = CALLOUT.positive.text; }

    el("rect", {
      x: callout.x, y: callout.y,
      width: callout.w, height: callout.h,
      rx: 8, ry: 8,
      fill: cfill,
      stroke: cstroke,
      "stroke-width": 2,
      filter: "url(#cardShadow)",
    }, g);

    // Connector to node
    const target = RENDER_IR.nodes.find(function (n) { return n.id === callout.on; });
    if (target) {
      el("line", {
        x1: callout.x + callout.w / 2,
        y1: callout.y + callout.h,
        x2: callout.x + callout.w / 2,
        y2: target.y - 2,
        stroke: cstroke,
        "stroke-width": 2,
        "stroke-dasharray": "4 4",
      }, g);
    }

    const textLines = wrapText(callout.text || "", 10).slice(0, 2);
    const cy = callout.y + callout.h / 2;
    textLines.forEach(function (line, i) {
      const offset = (i - (textLines.length - 1) / 2) * 18;
      const t = el("text", {
        x: callout.x + callout.w / 2,
        y: cy + offset,
        "text-anchor": "middle",
        fill: ctext,
        "font-family": "Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif",
        "font-size": 14,
        "font-weight": "bold",
      }, g);
      t.textContent = line;
    });
  });

  // ---------- animation ----------

  // Reveal sets are recomputed each frame from the timeline (monotonic).
  const DIM_OPACITY = 0.62;  // already-shown but not the current beat
  const FADE_IN = 0.4;       // seconds

  let isPaused = false;
  let currentTime = 0;
  let startTimestamp = null;

  function renderFrame(t) {
    currentTime = t;

    // Current beat
    let currentBeat = null;
    for (let i = 0; i < RENDER_IR.timeline.length; i++) {
      const tt = RENDER_IR.timeline[i];
      if (t >= tt.at && t < tt.at + tt.duration) {
        currentBeat = tt;
        break;
      }
    }

    // Compute revealed sets: every beat whose at <= t contributes its reveal.
    const revealedTitle = RENDER_IR.timeline.some(function (tt) {
      return tt.at <= t && tt.reveal === "title";
    });
    const revealedNodes = new Set();
    const revealedEdges = new Set();
    const revealedCallouts = new Set();
    for (let i = 0; i < RENDER_IR.timeline.length; i++) {
      const tt = RENDER_IR.timeline[i];
      if (tt.at > t) break;
      const r = tt.reveal;
      if (r === "title") continue;
      if (NODE_IDS.has(r))     revealedNodes.add(r);
      else if (EDGE_IDS.has(r))    revealedEdges.add(r);
      else if (CALLOUT_IDS.has(r)) revealedCallouts.add(r);
      // unknown reveal strings are ignored on purpose
    }

    // Title group: shown from first 'title' beat onward, stays at full opacity.
    if (!revealedTitle) {
      titleGroup.setAttribute("opacity", 0);
    } else if (currentBeat && currentBeat.reveal === "title") {
      const into = t - currentBeat.at;
      titleGroup.setAttribute("opacity", Math.min(1, into / FADE_IN).toFixed(3));
    } else {
      titleGroup.setAttribute("opacity", 1);
    }

    // Helper: pick opacity for a given id, given its revealed set
    function opFor(revealedSet, id, isCallout) {
      if (!revealedSet.has(id)) return 0;
      const baseDim = isCallout ? 0.72 : DIM_OPACITY;
      if (currentBeat && currentBeat.reveal === id) {
        const into = t - currentBeat.at;
        return Math.min(1, into / FADE_IN);
      }
      return baseDim;
    }

    // Nodes
    RENDER_IR.nodes.forEach(function (node) {
      const g = nodesGroup.querySelector('g[data-node-id="' + node.id + '"]');
      if (!g) return;
      g.setAttribute("opacity", opFor(revealedNodes, node.id, false).toFixed(3));
    });

    // Edges
    RENDER_IR.edges.forEach(function (edge) {
      const g = edgesGroup.querySelector('g[data-edge-id="' + edge.id + '"]');
      if (!g) return;
      g.setAttribute("opacity", opFor(revealedEdges, edge.id, false).toFixed(3));
    });

    // Callouts
    RENDER_IR.callouts.forEach(function (callout) {
      const g = calloutsGroup.querySelector('g[data-callout-id="' + callout.id + '"]');
      if (!g) return;
      g.setAttribute("opacity", opFor(revealedCallouts, callout.id, true).toFixed(3));
    });

    // Subtitle = current beat's narration (or dialogue turn text if dialogue enabled)
    // CP9: Handle dialogue turn subtitle and speaker highlighting
    if (DIALOGUE_TURNS && DIALOGUE_TURNS.length > 0) {
      let activeTurn = null;
      for (let i = 0; i < DIALOGUE_TURNS.length; i++) {
        const turn = DIALOGUE_TURNS[i];
        if (t >= turn.start && t < turn.end) {
          activeTurn = turn;
          break;
        }
      }

      if (activeTurn) {
        subtitleText.textContent = activeTurn.text || "";
        // Highlight active speaker
        if (activeTurn.speaker === "host") {
          speakerHostCard.classList.add("active");
          speakerExpertCard.classList.remove("active");
          hostIndicator.setAttribute("opacity", "1");
          expertIndicator.setAttribute("opacity", "0");
        } else if (activeTurn.speaker === "expert") {
          speakerExpertCard.classList.add("active");
          speakerHostCard.classList.remove("active");
          expertIndicator.setAttribute("opacity", "1");
          hostIndicator.setAttribute("opacity", "0");
        } else {
          speakerHostCard.classList.remove("active");
          speakerExpertCard.classList.remove("active");
          hostIndicator.setAttribute("opacity", "0");
          expertIndicator.setAttribute("opacity", "0");
        }
      } else {
        // No active turn — dim both speakers
        subtitleText.textContent = "";
        speakerHostCard.classList.remove("active");
        speakerExpertCard.classList.remove("active");
        hostIndicator.setAttribute("opacity", "0");
        expertIndicator.setAttribute("opacity", "0");
      }
    } else {
      subtitleText.textContent = currentBeat ? currentBeat.narration : "";
    }
  }

  // Expose controls for the exporter
  window.__setTime__ = function (t) {
    isPaused = true;
    renderFrame(t);
  };
  window.__getTotalDuration__ = function () {
    return RENDER_IR.total_duration + 1.0; // 1s tail
  };

  function loop(ts) {
    if (!isPaused) {
      if (startTimestamp === null) startTimestamp = ts;
      const elapsed = (ts - startTimestamp) / 1000;
      renderFrame(elapsed);
    }
    requestAnimationFrame(loop);
  }

  renderFrame(0);
  requestAnimationFrame(loop);
  window.__ANIMATION_READY__ = true;
})();
</script>
</body>
</html>
